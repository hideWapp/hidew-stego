[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hidew-stego"
version = "1.0.0"
description = "Encrypted, key-scattered LSB steganography for PNG images."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pillow>=10",
    "numpy>=1.26",
    "cryptography>=42",
    "argon2-cffi>=23",
]
keywords = ["steganography", "lsb", "argon2", "aes-gcm", "png", "steganalysis"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
hidew-stego = "hidew_stego.cli:main"

[tool.setuptools]
packages = ["hidew_stego"]

[tool.pytest.ini_options]
testpaths = ["tests"]
